# Filters for real CMS SPUF ingestion (AR + TX)
contract_year: 2026

states:
  - AR
  - TX

# PDP plans use PDP_REGION_CODE (not STATE). See CMS SPUF MA_REGION/PDP_REGION tables.
pdp_region_codes:
  AR: "19"  # Arkansas (geographic locator PDP region)
  TX: "22"  # Texas

# Include stand-alone PDP (S*) and local MA-PD (H*) plans
plan_type_prefixes:
  - S
  - H
