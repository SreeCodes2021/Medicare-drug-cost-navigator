# CMS SPUF ingest configuration.
# - pdp_region_codes: full catalog (all states/territories CMS publishes)
# - states: default active set when INGEST_STATES env is unset (local dev)
# - Production: set INGEST_STATES on Render (e.g. AR,TX,CA); cron ingests the
#   intersection of INGEST_STATES and pdp_region_codes — no redeploy to add a state.

contract_year: 2026

# Default active states (local dev / fallback when INGEST_STATES is unset)
states:
  - AR
  - TX

# Full CMS PDP region catalog — one code per state/territory (SPUF geographic locator).
# PDP stand-alone plans (S*) match on PDP_REGION_CODE; MA-PD (H*) match on STATE.
pdp_region_codes:
